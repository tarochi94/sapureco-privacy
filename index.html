<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サプレコ</title>
  <meta name="description" content="サプレコのサポート情報、プライバシーポリシー、利用規約">
  <style>
    :root { color-scheme: light; --ink:#2f2a25; --muted:#756c64; --accent:#d97758; --paper:#fffaf6; --card:#ffffff; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(180deg,#fff4ec,var(--paper) 35%); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.75; }
    main { width:min(760px,calc(100% - 40px)); margin:0 auto; padding:72px 0; }
    .mark { width:64px; height:64px; display:grid; place-items:center; border-radius:20px; background:#f9d7c8; font-size:32px; }
    h1 { margin:18px 0 4px; font-size:clamp(32px,7vw,48px); letter-spacing:.04em; }
    .lead { margin:0 0 36px; color:var(--muted); }
    nav { display:grid; gap:12px; }
    a { color:var(--accent); }
    nav a { display:block; padding:18px 20px; color:var(--ink); background:var(--card); border:1px solid #f0ddd2; border-radius:16px; text-decoration:none; box-shadow:0 8px 24px rgba(89,56,39,.06); }
    footer { margin-top:40px; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🌿</div>
    <h1>サプレコ</h1>
    <p class="lead">サプリと変化を、やさしく記録。</p>
    <nav aria-label="サポート情報">
      <a href="privacy-policy.html">プライバシーポリシー</a>
      <a href="terms.html">利用規約</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSea8Vjn_NZ8IM49Yjys_GT6yWKUgMAwvBUM6XIj4ZUUxGRp0w/viewform">ご意見・お問い合わせ</a>
    </nav>
    <footer>© 2026 サプレコ</footer>
  </main>
</body>
</html>
